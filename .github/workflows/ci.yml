name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, warnings as errors)
        run: cargo clippy --workspace --exclude freemarker-pyo3 --all-targets -- -D warnings

      - name: Test (workspace, excluding pyo3)
        run: cargo test --workspace --exclude freemarker-pyo3

  msrv:
    name: MSRV build (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85 (MSRV)
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - name: cargo check (MSRV)
        run: cargo check --workspace --exclude freemarker-pyo3

  pyo3:
    name: Python bindings (pyo3) ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
    env:
      # abi3 前向兼容（docs/10 §7；可选：当前未传 --abi3，此变量对非 abi3
      # 构建无副作用，仅文档化该特性入口，见 freemarker-pyo3/pyproject.toml）
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pyo3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pyo3-

      - name: Install maturin and pytest
        run: pip install maturin pytest

      - name: Build wheel
        working-directory: freemarker-pyo3
        # --interpreter 显式绑定当前 job 的 Python（setup-python 矩阵版本）；
        # 先清 target/wheels：cache 按 Cargo.lock 键跨 Python 版本共享，残留
        # 其他版本 wheel（如 cp313）会让 pip install *.whl 误装失败
        run: |
          rm -rf ../target/wheels
          maturin build --release --interpreter "$(python3 -c 'import sys; print(sys.executable)')"

      # maturin 输出到 workspace 共享 target 目录（仓库根 target/wheels/）
      - name: Install wheel
        run: pip install target/wheels/*.whl

      - name: Python tests (smoke + threading + golden suite)
        run: python -m pytest freemarker-pyo3/tests/ -q

      - name: Rust unit tests (freemarker-pyo3, rlib links libpython)
        run: |
          PY_LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="$PY_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$PY_LIBDIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          cargo test -p freemarker-pyo3

  governance:
    name: Governance gates (deny / audit / public-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check dependency licenses, sources, and duplicates
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check dependency vulnerabilities (cargo-audit)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api

      - name: Enforce core crate public API baseline (docs/release/api-baseline.txt)
        # 任何未登记的公开 API 变更（增/删/改签名）都会使 diff 非空而失败；
        # 有意的 API 变更须显式更新基线并在 PR 说明。
        # 环境约束（逐项踩坑确认）：
        #  - cargo-public-api 输出随 rustc 版本漂移（1.97.1 缺 builtins 模块）
        #    → 固定 1.93（api-baseline.txt 生成版本；升级工具链须重新生成基线）
        #  - dtolnay/rust-toolchain 注入 RUSTUP_TOOLCHAIN=stable（env 优先于
        #    override）→ export RUSTUP_TOOLCHAIN=1.93.0 覆盖
        #  - 全局 RUSTFLAGS=-D warnings 使 1.93 rustdoc 的 doc 警告变 error →
        #    本步骤清空 RUSTFLAGS
        #  - taiki-e 装的 cargo-public-api 由 stable(1.97) 编译，spawn 1.93
        #    rustc 时静默失败（空输出）→ 用 1.93 重新编译安装
        # 基线生成环境：`rustup run 1.93.0 cargo public-api`（3707 行）
        run: |
          # cargo-public-api 需 nightly（rustdoc JSON）；基线由 nightly-2026-07-28
          # 生成——固定同日期避免输出漂移。RUSTUP_TOOLCHAIN 覆盖 dtolnay 的
          # stable；RUSTFLAGS 清空（-D warnings 使 rustdoc 警告变 error）
          rustup toolchain install nightly-2026-07-28 --profile minimal
          export RUSTUP_TOOLCHAIN=nightly-2026-07-28
          RUSTFLAGS= cargo public-api -p freemarker > /tmp/api.txt 2>/tmp/api.err \
            || { echo "public-api FAILED"; cat /tmp/api.err; exit 1; }
          echo "lines=$(wc -l < /tmp/api.txt)"
          diff /tmp/api.txt docs/release/api-baseline.txt

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --exclude freemarker-pyo3 --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          target: 85%
