name: Publish pyo3 (PyPI)

# Python 绑定发布（用户决策：准备到可发布，实际上传由仓库维护者手动触发）。
# 流程：tag 触发 → 构建 sdist + 各平台 wheel → 上传 PyPI。
# 认证双路径：
#   1. 优先仓库 Secrets 的 PYPI_API_TOKEN（PyPI Account settings → API tokens 生成）
#   2. 无 token 时走 Trusted Publishing（需在 PyPI 配置发布者：
#      https://docs.pypi.org/trusted-publishers/ —— GitHub 用户 easy-4-rust、
#      仓库 freemarker-rust、Environment 留空或填 pypi、项目 freemarker-pyo3）

on:
  push:
    tags:
      - 'pyo3-v*'        # 示例：pyo3-v0.1.0-alpha.1
  workflow_dispatch: {}  # 手动触发（重跑发布无需新 tag）

permissions:
  contents: read
  id-token: write        # Trusted Publishing

jobs:
  build-and-publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist and wheels
        working-directory: freemarker-pyo3
        run: maturin build --release --sdist --out ../dist

      - name: Publish to PyPI (API token)
        # PYPI_API_TOKEN secret 已配置 → token 认证
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (Trusted Publishing)
        # 无 token → OIDC Trusted Publishing（需 PyPI 发布者配置）
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # TestPyPI 演练用：
          # repository-url: https://test.pypi.org/legacy/
