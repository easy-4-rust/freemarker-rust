[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "freemarker-pyo3"
description = "freemarker Rust 模板引擎的 Python 绑定（freemarker-jython25 迁移）"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]
dynamic = ["version"]

[tool.maturin]
# Python 侧模块名 = freemarker（对应 Java `import freemarker.template.Configuration`）
module-name = "freemarker"
# cdylib 构建启用 extension-module（rlib/cargo test 构建不启用，见 Cargo.toml [features]）
features = ["extension-module"]
