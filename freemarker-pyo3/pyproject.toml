[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "freemarker-pyo3"
description = "freemarker Rust 模板引擎的 Python 绑定（freemarker-jython25 迁移）"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "easy-4-rust", email = "easy-4-rust@users.noreply.github.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup",
]
dynamic = ["version"]

[tool.maturin]
# Python 侧模块名 = freemarker（对应 Java `import freemarker.template.Configuration`）
module-name = "freemarker"
# cdylib 构建启用 extension-module（rlib/cargo test 构建不启用，见 Cargo.toml [features]）
features = ["extension-module"]

# --- abi3 前向兼容（docs/10 §7；可选）---
# 若需发布 abi3 wheel（`maturin build --release --abi3`），设置环境变量
#   PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
# 使 abi3 二进制在更老的 CPython 上也可加载（pyo3 用编译期版本探测替代
# 运行时 API 缺失检查）。CI 的 pyo3 任务已文档化该变量（当前非 abi3 构建，
# 变量无副作用）；需要 abi3 时在此取消注释并配合 --abi3 构建：
# [tool.maturin]
# abi3 = true
# abi3-py38 = "3.8"
