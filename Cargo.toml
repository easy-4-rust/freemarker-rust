[workspace]
resolver = "2"
members = ["freemarker", "freemarker-test", "freemarker-pyo3"]
default-members = ["freemarker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Apache FreeMarker 语义兼容的 Rust 模板引擎"
authors = ["Thymeleaf Rust Contributors"]
repository = "https://github.com/easy-4-rust/freemarker-rust"
homepage = "https://github.com/easy-4-rust/freemarker-rust"
categories = ["template-engine", "text-processing"]
keywords = ["freemarker", "template", "templating", "ast"]

[workspace.dependencies]
thiserror = "2"
regex = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
encoding_rs = "0.8"
bigdecimal = "0.4"
num-bigint = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
indexmap = "2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
