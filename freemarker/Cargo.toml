[package]
name = "freemarker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Apache FreeMarker 语义兼容的 Rust 模板引擎（freemarker-core 迁移）"

categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
license-file = "../LICENSE"

# 显式 include：README 和 LICENSE 位于 workspace 根（freemarker-rust/），
# 默认 cargo package 只在 crate 子目录查找；通过 include 携带 ../README.md 与
# ../LICENSE 进 .crate 包，确保 crates.io README 渲染正常。
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "../README.md",
    "../LICENSE",
]

[package.metadata.docs.rs]
# docs.rs 自动构建配置（freemarker crate 上传 crates.io 后自动触发）
all-features = true
# rustdoc-args：把方法来源标注显式展示（Java 对应注释已嵌入 ///）
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror.workspace = true
regex.workspace = true
fancy-regex.workspace = true
unicode-normalization.workspace = true
encoding_rs.workspace = true
bigdecimal.workspace = true
num-bigint.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
indexmap.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree.workspace = true

[dev-dependencies]
serde_json.workspace = true
chrono-tz.workspace = true
regex.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "simple_render"
harness = false

[features]
default = []
