[package]
name = "freemarker-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.freemarker]
path = "../freemarker"

[[bin]]
name = "expression"
path = "fuzz_targets/expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

# cargo-fuzz 惯例：fuzz crate 独立于主 workspace（libfuzzer 需独立构建，
# 避免与 workspace 共享 target 干扰）
[workspace]
